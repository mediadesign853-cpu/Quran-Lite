
name: Release Windows application

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python for Quran text regression tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Verify Portable update public key
        run: node scripts/verify-portable-update-key.cjs

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run project checks
        run: npm run check

      - name: Build NSIS and Portable artifacts
        run: npm run dist:win -- --publish never

      - name: Create signed Portable update manifest
        run: node scripts/create-portable-update-manifest.cjs
        env:
          PORTABLE_UPDATE_PRIVATE_KEY: ${{ secrets.PORTABLE_UPDATE_PRIVATE_KEY }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Publish one release with every update asset
        shell: pwsh
        run: |
          $repo = "mediadesign853-cpu/Quran-Lite"
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = @()
          Get-ChildItem -Path release -File | Where-Object {
            $_.Name -like "*$version*" -or $_.Name -in @("latest.yml", "latest-portable.json")
          } | ForEach-Object {
            $name = $_.Name -replace " ", "-"
            $target = Join-Path release $name
            if ($name -ne $_.Name) { Move-Item -LiteralPath $_.FullName -Destination $target -Force }
            $files += $target
          }
          $required = @(
            "Quran-Reader-Lite-Portable-$version.exe",
            "Quran-Reader-Lite-Setup-$version.exe",
            "latest.yml",
            "latest-portable.json"
          )
          foreach ($name in $required) {
            if ($files -notcontains (Join-Path release $name)) { throw "Missing release asset: $name" }
          }
          if (gh release view $tag --repo $repo 2>$null) {
            $arguments = @("release", "upload", $tag, "--clobber", "--repo", $repo) + $files
          } else {
            $arguments = @("release", "create", $tag, "--title", $tag, "--notes", "Automated Windows release", "--repo", $repo) + $files
          }
          & gh @arguments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
